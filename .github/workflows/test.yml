name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/CrackShot.Tests --logger "console;verbosity=normal"
